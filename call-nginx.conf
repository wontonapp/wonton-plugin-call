# Element Call 镜像自带的 nginx 配置（config/nginx.conf）加了 /livekit/sfu 一段：
# 信令 WebSocket 和插件页同源，手机经 App 的本地代理直达，LiveKit 不另开映射。
server {
    listen 8080;
    server_name localhost;

    root /app;
    gzip_static on;
    gzip_vary on;

    location ^~ /livekit/sfu/ {
        proxy_pass http://livekit:7880/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_send_timeout 120;
        proxy_read_timeout 120;
        proxy_buffering off;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=30, stale-while-revalidate=30";
    }

    # assets 可以长缓存：文件名带内容哈希
    location /assets {
        add_header Cache-Control "public, immutable, max-age=31536000";
    }

    location /apple-app-site-association {
        default_type application/json;
    }
}
